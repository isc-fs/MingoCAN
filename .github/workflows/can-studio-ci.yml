name: ISC MingoCAN CI

# Lint + test smoke check for the Tauri desktop app (svelte-check, frontend
# build, clippy -D warnings, cargo test). Bundling only happens in release.yml.
# Runs when the app, or the can-flasher library it links by path
# (src/**), changes.
#
# Matrix: ubuntu-latest, macos-latest, windows-latest — all three
# target platforms get exercised on every PR that changes the app or the library.

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/can-studio/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/can-studio-ci.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/can-studio/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/can-studio-ci.yml'
  workflow_dispatch:

concurrency:
  group: can-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            apt_deps: >-
              libwebkit2gtk-4.1-dev
              libgtk-3-dev
              libayatana-appindicator3-dev
              librsvg2-dev
              libudev-dev
              pkg-config
          - os: macos-latest
            apt_deps: ''
          - os: windows-latest
            apt_deps: ''
    defaults:
      run:
        working-directory: apps/can-studio
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKit / GTK build deps
        if: matrix.apt_deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: false
          rustflags: ''

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace root lives at the repo top; cache its
          # target/ directory rather than the apps/can-studio default.
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate platform icon variants
        # `tauri-build` requires `icons/icon.ico` on Windows for the
        # generated resource file (and `icon.icns` for macOS bundles).
        # We commit only `icon.png` and let CI regenerate the rest
        # via the bundled `@tauri-apps/cli`. Local devs run the same
        # command once after first `npm install`.
        run: npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/icon.png

      - name: Type-check Svelte sources
        run: npm run check

      - name: Build frontend (production)
        run: npm run build

      - name: Clippy Tauri Rust crate
        # `cargo build` for the full Tauri app produces a native
        # bundle (.dmg / .deb / .msi) which is large and slow on
        # every PR. Clippy verifies the crate compiles with no
        # warnings and the test step runs its unit tests; full
        # bundling lands in a separate workflow when we cut a release.
        # `-p can-studio` is required: the root package is not a
        # virtual workspace, so ci.yml's clippy/test only cover
        # can-flasher.
        run: cargo clippy -p can-studio --all-targets -- -D warnings
        working-directory: ${{ github.workspace }}

      - name: Test Tauri Rust crate
        run: cargo test -p can-studio
        working-directory: ${{ github.workspace }}
